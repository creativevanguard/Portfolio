media:
  input: images
  output: images

content:
  - name: site
    label: Portfolio content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        required: true
        description: Shown in the intro animation, the logo, the About page and on the contact letter.
      - name: role
        label: Role
        type: string
        description: e.g. "Web & brand designer"
      - name: location
        label: Location
        type: string
      - name: headline
        label: Home page headline
        type: string
        description: Each word melts in separately. Keep it to 3–4 words, e.g. "Web & brand Designer".
      - name: hero_video
        label: Home page video (desktop)
        type: file
        description: Short looping MP4, muted, about 1920×1080 and under ~3 MB. Plays behind the headline. Leave empty to use the photo below.
      - name: hero_video_mobile
        label: Home page video (phones, optional)
        type: file
        description: Smaller copy of the same video (about 960 px wide) so it loads fast on mobile.
      - name: hero_poster
        label: Video still (shows while the video loads)
        type: image
      - name: hero_photo
        label: Home page photo
        type: image
        description: A wide, landscape photo of you (about 2000 px wide). Leave empty to show the illustrated room.

      - name: about
        label: About page
        type: object
        fields:
          - name: portrait
            label: Portrait — front view (0°)
            type: image
            description: Front-facing head shot with the background removed (transparent PNG). This becomes the rotatable mugshot.
          - name: views
            label: Extra head-turn views (optional)
            type: object
            description: Same lighting, crop and size as the front view, background removed. Upload one side and the other is mirrored automatically.
            fields:
              - name: left_34
                label: Three-quarter left (45°) — face turned toward the left of the image
                type: image
              - name: left_side
                label: Side profile left (90°) — face pointing to the left of the image
                type: image
              - name: right_34
                label: Three-quarter right (45°) — face turned toward the right of the image
                type: image
              - name: right_side
                label: Side profile right (90°) — face pointing to the right of the image
                type: image
          - name: face
            label: Face points on the front view (advanced)
            type: object
            description: "Positions as fractions of the image (0 = left/top, 1 = right/bottom). Only change these if you replace the front photo and the eyes don't line up."
            fields:
              - {name: eye_left_x, label: Left eye centre X, type: number}
              - {name: eye_left_y, label: Left eye centre Y, type: number}
              - {name: eye_right_x, label: Right eye centre X, type: number}
              - {name: eye_right_y, label: Right eye centre Y, type: number}
              - {name: eye_w, label: Eye half-width, type: number}
              - {name: eye_h, label: Eye half-height, type: number}
              - {name: nose_x, label: Nose tip X, type: number}
              - {name: nose_y, label: Nose tip Y, type: number}
              - {name: hairline, label: Hairline Y (where forehead meets hair), type: number}
          - name: lead
            label: Intro sentence
            type: text
          - name: bio
            label: Bio
            type: text
            description: Leave an empty line between paragraphs.
          - name: experience
            label: Experience
            type: object
            list: true
            fields:
              - name: name
                label: Company / place
                type: string
              - name: detail
                label: Role
                type: string
          - name: services
            label: Services
            type: object
            list: true
            fields:
              - name: name
                label: Service
                type: string
              - name: detail
                label: Short detail
                type: string

      - name: contact
        label: Contact
        type: object
        fields:
          - name: email
            label: Email (letters are addressed here)
            type: string
            required: true
          - name: intro
            label: Contact intro text
            type: text
          - name: links
            label: Links
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
                description: e.g. WhatsApp, Behance, LinkedIn, Instagram
              - name: text
                label: Text shown
                type: string
              - name: url
                label: Link
                type: string
                description: "Full address starting with https:// (WhatsApp: https://wa.me/94XXXXXXXXX)"

      - name: projects
        label: Projects
        type: object
        list: true
        description: Drag to reorder. The first project is shown first.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: subtitle
            label: Subtitle
            type: string
            description: e.g. "Real estate website"
          - name: year
            label: Year
            type: string
          - name: category
            label: Category (filter)
            type: select
            options:
              values:
                - name: web
                  label: Web
                - name: print
                  label: Print
                - name: brand
                  label: Brand
                - name: presentation
                  label: Presentation
                - name: motion
                  label: Motion
                - name: other
                  label: Other
          - name: tags
            label: Tags
            type: string
            list: true
          - name: description
            label: Description
            type: text
          - name: cover
            label: Cover image
            type: image
            description: Landscape, 3:2 works best (e.g. 1800 × 1200). Leave empty for an illustrated placeholder.
          - name: gallery
            label: Gallery images
            type: image
            description: Extra images shown when the project is opened.
            options:
              multiple:
                max: 12
          - name: link
            label: Live link (optional)
            type: string
